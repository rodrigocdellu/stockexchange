name: SonarQubeReactUI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  frontend:
    name: Frontend - React - Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StockExchange.ReactUI

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Install StockExchange.ReactUI Dependencies
        run: npm ci --ignore-scripts

      - name: Build StockExchange.ReactUI
        run: npm run build

      - name: Begin Sonar Analysis for StockExchange.ReactUI
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
